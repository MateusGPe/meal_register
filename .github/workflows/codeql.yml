# Para a maioria dos projetos, este arquivo de workflow não precisará ser alterado;
# você só precisa commitá-lo no seu repositório.
#
# Você pode querer alterar este arquivo para modificar o conjunto de linguagens analisadas,
# ou para fornecer consultas personalizadas ou lógica de compilação.
#
# ******** NOTA ********
# Tentamos detectar as linguagens em seu repositório. Por favor, verifique
# a matriz `language` definida abaixo para confirmar que possui o conjunto correto de
# linguagens suportadas pelo CodeQL.
#
name: "CodeQL Avançado"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '39 18 * * 5'

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    # O tamanho do runner impacta o tempo de análise do CodeQL. Para saber mais, consulte:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (apenas GitHub.com)
    # Considere usar runners maiores para possíveis melhorias no tempo de análise.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # obrigatório para todos os workflows
      security-events: write

      # obrigatório para buscar pacotes internos ou privados do CodeQL
      packages: read

      # obrigatório apenas para workflows em repositórios privados
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none
        # O CodeQL suporta as seguintes palavras-chave para 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift'
        # Use `c-cpp` para analisar código escrito em C, C++ ou ambos
        # Use 'java-kotlin' para analisar código escrito em Java, Kotlin ou ambos
        # Use 'javascript-typescript' para analisar código escrito em JavaScript, TypeScript ou ambos
        # Para saber mais sobre como alterar as linguagens analisadas ou personalizar o modo de build,
        # consulte https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # Se você estiver analisando uma linguagem compilada, pode modificar o 'build-mode' para personalizar
        # como seu código é analisado, consulte https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Fazer checkout do repositório
      uses: actions/checkout@v4

    # Adicione etapas de preparação antes de executar a action `github/codeql-action/init`.
    # Isso inclui passos como instalar compiladores ou runtimes (`actions/setup-node`
    # ou outros). Normalmente só é necessário para builds manuais.
    # - name: Configurar runtime (exemplo)
    #   uses: actions/setup-example@v1

    # Inicializa as ferramentas do CodeQL para a varredura.
    - name: Inicializar CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # Se desejar especificar consultas personalizadas, faça isso aqui ou em um arquivo de configuração.
        # Por padrão, consultas listadas aqui sobrescreverão as especificadas no arquivo de configuração.
        # Prefixe a lista aqui com "+" para usar essas consultas juntamente com as do arquivo de configuração.

        # Para mais detalhes sobre os pacotes de consulta do CodeQL, consulte: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # Se a etapa de análise falhar para uma das linguagens com o erro
    # "We were unable to automatically build your code", modifique a matriz acima
    # para definir o build-mode como "manual". Depois, modifique esta etapa para compilar o código.
    # ℹ️ Programas de linha de comando para executar usando o shell do SO.
    # 📚 Veja https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'Se você estiver usando o modo de build "manual" para uma ou mais' \
          'linguagens analisadas, substitua isto pelos comandos para compilar' \
          'seu código, por exemplo:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Executar Análise CodeQL
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
