# Este workflow utiliza actions que não são certificadas pelo GitHub.
# Elas são fornecidas por terceiros e regidas por termos de serviço,
# políticas de privacidade e documentação de suporte separados.

# O Bandit é um linter de segurança projetado para encontrar problemas comuns de segurança em código Python.
# Esta action executará o Bandit na sua base de código.
# Os resultados da verificação estarão disponíveis na aba Security do seu repositório.

# https://github.com/marketplace/actions/bandit-scan possui licença ISC, por abirismyname
# https://pypi.org/project/bandit/ possui licença Apache v2.0, por PyCQA

name: Bandit
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    # As branches abaixo devem ser um subconjunto das branches acima
    branches: [ "main" ]
  schedule:
    - cron: '35 11 * * 5'

jobs:
  bandit:
    permissions:
      contents: read # para actions/checkout buscar o código
      security-events: write # para github/codeql-action/upload-sarif enviar os resultados SARIF
      actions: read # necessário apenas para repositórios privados por github/codeql-action/upload-sarif para obter o status da Action

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificação Bandit
        uses: shundor/python-bandit-scan@ab1d87dfccc5a0ffab88be3aaac6ffe35c10d6cd
        with: # argumentos opcionais
          # sair com status 0, mesmo com problemas encontrados
          exit_zero: true # opcional, padrão é DEFAULT
          # Token do GitHub do repositório (criado automaticamente pelo GitHub)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Necessário para obter informações do PR.
          # Arquivo ou diretório para executar o bandit
          # path: # opcional, padrão é .
          # Reportar apenas problemas de um determinado nível de severidade ou superior. Pode ser LOW, MEDIUM ou HIGH. Padrão é UNDEFINED (tudo)
          # level: # opcional, padrão é UNDEFINED
          # Reportar apenas problemas de um determinado nível de confiança ou superior. Pode ser LOW, MEDIUM ou HIGH. Padrão é UNDEFINED (tudo)
          # confidence: # opcional, padrão é UNDEFINED
          # lista separada por vírgulas de caminhos (suporta padrões glob) a ignorar na verificação (além dos caminhos excluídos no arquivo de config) (padrão: .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg)
          # excluded_paths: # opcional, padrão é DEFAULT
          # lista separada por vírgulas de IDs de testes para ignorar
          # skips: # opcional, padrão é DEFAULT
          # caminho para um arquivo .bandit que fornece argumentos de linha de comando
          # ini_path: # opcional, padrão é DEFAULT
